<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pegawai - AplikasiPegawai</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 5rem; background-color: #f8f9fa; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 600px; margin: 0 auto; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">AplikasiPegawai</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="table.html">Tabel Data</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="form.html">Tambah Baru</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="card-title mb-0" id="formTitle">Tambah Pegawai Baru</h4>
            </div>
            <div class="card-body">
                <form id="employeeForm">
                    <input type="hidden" id="employeeId">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nama Lengkap</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="position" class="form-label">Posisi</label>
                        <input type="text" class="form-control" id="position" required>
                    </div>
                    <div class="mb-3">
                        <label for="office" class="form-label">Kantor</label>
                        <input type="text" class="form-control" id="office" required>
                    </div>
                    <div class="mb-3">
                        <label for="salary" class="form-label">Gaji</label>
                        <input type="text" class="form-control" id="salary" placeholder="cth. Rp 10.000.000" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary" id="saveBtn">Simpan Data</button>
                        <a href="table.html" class="btn btn-secondary">Batal</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        $(document).ready(function() {
            // Check if we are in edit mode
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            
            if (id) {
                $('#formTitle').text('Edit Pegawai');
                $('#saveBtn').text('Perbarui Data');
                $('.nav-link.active').text('Edit Data');
                
                // Fetch existing data
                $.ajax({
                    url: '/api/employees/' + id,
                    type: 'GET',
                    success: function(data) {
                        $('#employeeId').val(data.id);
                        $('#name').val(data.name);
                        $('#position').val(data.position);
                        $('#office').val(data.office);
                        $('#salary').val(data.salary);
                    },
                    error: function() {
                        alert('Gagal memuat data pegawai. Mungkin data telah dihapus.');
                        window.location.href = 'table.html';
                    }
                });
            }
            
            // Handle Form Submits
            $('#employeeForm').submit(function(e) {
                e.preventDefault();
                
                const empId = $('#employeeId').val();
                const method = empId ? 'PUT' : 'POST';
                const url = empId ? '/api/employees/' + empId : '/api/employees';
                
                const payload = {
                    name: $('#name').val(),
                    position: $('#position').val(),
                    office: $('#office').val(),
                    salary: $('#salary').val()
                };
                
                $.ajax({
                    url: url,
                    type: method,
                    contentType: 'application/json',
                    data: JSON.stringify(payload),
                    success: function() {
                        // Redirect to table on success
                        window.location.href = 'table.html';
                    },
                    error: function() {
                        alert('Gagal menyimpan data.');
                    }
                });
            });
        });
    </script>
</body>
</html>
